apiVersion: apps/v1
kind: Deployment
metadata:
  name: survey-api
  namespace: survey
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: survey-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: survey-api
    spec:
      serviceAccountName: survey-api
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: survey-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: survey-api
      containers:
        - name: api
          image: me-west1-docker.pkg.dev/PROJECT_ID/survey/api@sha256:DIGEST
          args: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
                 "--timeout-graceful-shutdown", "25"]
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: survey-api
  namespace: survey
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: survey-api
---
apiVersion: v1
kind: Service
metadata:
  name: survey-api
  namespace: survey
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "survey-api"}'
spec:
  selector:
    app: survey-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: survey-api
  namespace: survey
spec:
  connectionDraining:
    drainingTimeoutSec: 30
  healthCheck:
    type: HTTP
    requestPath: /healthz/ready
    port: 8000
